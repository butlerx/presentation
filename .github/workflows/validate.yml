name: Validate PR
on:
  pull_request:
    branches:
      - 'master'
      - 'main'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm i
      - name: Build site
        run: pnpm build
